services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: citas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: citas
    volumes:
      # Datos persistentes: sin esto, cada redeploy borra todas las citas.
      - pgdata:/var/lib/postgresql/data
      # El esquema se aplica solo la PRIMERA vez que el volumen está vacío
      # (comportamiento estándar de la imagen oficial) — no en cada arranque.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      # Los backups, en SOLO LECTURA. Aquí es donde uno restaura (este
      # contenedor es el que tiene psql y la consola de EasyPanel), y sin
      # montarlos no se pueden ni ver ni probar. `:ro` para que un error
      # tecleando no borre los respaldos desde el mismo lugar donde se usan.
      - pgbackups:/backups:ro
    # Sin "ports": solo accesible dentro de la red interna del compose, ni
    # siquiera EasyPanel lo expone — mismo criterio que el puerto de la app.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citas -d citas"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ponytail: imagen ya hecha para exactamente esto (pg_dump programado +
  # rotación) en vez de escribir cron + script a mano. Backups locales en un
  # volumen aparte — protege de migraciones malas y borrados por accidente,
  # no de que se pierda el disco completo del VPS. Para eso hace falta mandar
  # copia fuera del servidor (S3, Google Drive...); pendiente, ver docs.
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    user: postgres
    volumes:
      - pgbackups:/backups
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: citas
      POSTGRES_USER: citas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_WEEKS: 8
      BACKUP_KEEP_MONTHS: 6

  citas-app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # "expose", no "ports": el puerto solo es visible dentro de la red interna
    # de Docker/EasyPanel. Nadie entra por http://IP:3000 saltándose el proxy
    # con HTTPS — mismo patrón que el resto de los productos internos.
    expose:
      - "3000"
    environment:
      # Se arma sola a partir de POSTGRES_PASSWORD: nadie tiene que copiar/pegar
      # una cadena de conexión a mano (así empezó todo este problema con Neon).
      DATABASE_URL: postgresql://citas:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}@postgres:5432/citas
      # Docker mete un HOSTNAME=<id del contenedor> automático, y el
      # server.js standalone de Next lo usa para bindear en vez de escuchar
      # en todas las interfaces. Con dos redes (default + easypanel) eso
      # hacía que a veces quedara sordo en la red por la que entra Traefik
      # -> 502 Bad Gateway intermitente. Forzar 0.0.0.0 lo evita siempre.
      HOSTNAME: "0.0.0.0"
    env_file:
      - .env

volumes:
  pgdata:
  pgbackups:
